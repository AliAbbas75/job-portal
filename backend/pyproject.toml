[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "migrations/versions"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
